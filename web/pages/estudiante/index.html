<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <!-- Incluir el CSS de Bootstrap desde el CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f4f4;
        }

        .container {
            max-width: 400px;
        }

        .modal-body input {
            margin-bottom: 10px;
        }

        .btn-custom {
            background-color: #3498db;
            color: white;
        }

        .btn-custom:hover {
            background-color: #2980b9;
        }

        .text-primary {
            color: #3498db !important;
        }

        /* Estilo para mensaje de carga */
        .loading-message {
            display: none;
            text-align: center;
            padding: 1rem;
            font-size: 1.2rem;
            color: #6c757d;
        }
    </style>
</head>

<body class="bg-light d-flex justify-content-center align-items-center vh-100">
    <div class="container p-4 shadow-lg rounded bg-white">
        <div class="text-center mb-4">
            <img src="../../assets/images/logo.png" class="img-thumbnail" alt="Logo" style="max-height: 100px;">
            <h1 class="h3">Inicio de Sesión Estudiantes</h1>
        </div>
        
        <form id="login-form">
            <div class="mb-3">
                <label for="numeroControl" class="form-label">Número de control</label>
                <input type="text" class="form-control" id="numeroControl" placeholder="Número de control" required>
            </div>
            <div class="mb-3">
                <label for="contraseña" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="contraseña" placeholder="Contraseña" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
        </form>
        
        <div class="loading-message text-center" id="loadingMessage" style="display: none;">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
            <p>Cargando</p>
        </div>

        <div class="mt-3 text-center">
            <a href="#" class="text-primary" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">
                <i class="bi bi-lock"></i> Olvidé mi contraseña
            </a>
        </div>
    </div>

    <!-- Modal para recuperar la contraseña -->
    <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-labelledby="forgotPasswordModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="forgotPasswordModalLabel">Recuperar Contraseña</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <label for="email" class="form-label">Ingresa tu correo electrónico</label>
                    <input type="email" id="email" class="form-control" placeholder="Correo electrónico" required>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-primary" id="recoverPassword">Recuperar Contraseña</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/scripts/config.js"></script> <!-- Archivo de configuración -->
    <script src="../../assets/scripts/estudiante/login_e.js"></script> <!-- Archivo con lógica del login -->
</body>
</html>
