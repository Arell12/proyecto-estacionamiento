<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Vehículo</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #F4F4F4;
        }
        .container {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .form-label {
            font-weight: bold;
        }
        .btn-custom {
            background-color: #0d6efd;
            color: white;
        }
        .btn-custom:hover {
            background-color: #0b5ed7;
        }
        .btn-outline-custom {
            border-color: #0d6efd;
            color: #0d6efd;
        }
        .btn-outline-custom:hover {
            background-color: #0b5ed7;
            color: white;
        }
        .alert-custom {
            margin-top: 20px;
            color: #fff;
            background-color: #2ecc71;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Editar Información del Vehículo</h1>
        <form id="vehicle-form">
            <!-- Combobox para Marca -->
            <div class="mb-3">
                <label for="vehicle-brand" class="form-label">Marca</label>
                <select id="vehicle-brand" class="form-control" required>
                    <option value="" disabled selected>Selecciona una marca</option>
                </select>
            </div>
            <!-- Combobox para Modelo -->
            <div class="mb-3">
                <label for="vehicle-model" class="form-label">Modelo</label>
                <select id="vehicle-model" class="form-control" required>
                    <option value="" disabled selected>Selecciona un modelo</option>
                </select>
            </div>
            <!-- Combobox para Año -->
            <div class="mb-3">
                <label for="vehicle-year" class="form-label">Año</label>
                <select id="vehicle-year" class="form-control" required>
                    <option value="" disabled selected>Selecciona un año</option>
                </select>
            </div>
            <!-- Input para Matrícula -->
            <div class="mb-3">
                <label for="vehicle-plate" class="form-label">Matrícula</label>
                <input type="text" id="vehicle-plate" class="form-control" required>
            </div>
            <!-- Botones -->
            <div class="row">
                <div class="col-4">
                    <button type="button" class="btn btn-custom w-100" id="save-changes">Guardar Cambios</button>
                </div>
                <div class="col-4 ms-3">
                    <button type="button" class="btn btn-outline-custom w-100" id="btnCancelar">Cancelar</button>
                </div>
            </div>
        </form>
        <!-- Mensaje de Confirmación -->
        <div id="confirmation-message" class="alert-custom d-none" role="alert">
            ¡Cambios guardados exitosamente!
        </div>
    </div>
    <script src="../../assets/scripts/config.js"></script>
    <script src="../../assets/scripts/estudiante/editar_auto.js" type="module"></script>
</body>
</html>
