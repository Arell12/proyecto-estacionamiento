<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estacionamiento - Incidencias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #F4F4F4;
        }
        .container {
            max-width: 800px;
        }
        .card-custom {
            margin-bottom: 1rem;
        }
        .btn-primary-custom {
            background-color: #007bff;
            border-color: #007bff;
        }
        .btn-primary-custom:hover {
            background-color: #0056b3;
        }
        .btn-warning-custom {
            background-color: #FFA726;
            border-color: #FFA726;
        }
        .btn-warning-custom:hover {
            background-color: #FF9800;
        }
        .btn-info-custom {
            background-color: #17a2b8;
            border-color: #17a2b8;
        }
        .btn-info-custom:hover {
            background-color: #138496;
        }
        .badge-custom {
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Título de la página -->
        <div class="row mt-4 mb-3">
            <div class="col">
                <h2>Lista de Incidencias</h2>
            </div>
        </div>

        <!-- Filtros -->
        <div class="row mb-3">
            <div class="col-md-6">
                <select class="form-select" id="filtroEstadoIncidencia">
                    <option value="">Todos los estados</option>
                    <option value="pendiente">Pendiente</option>
                    <option value="en_proceso">En Proceso</option>
                    <option value="resuelta">Resuelta</option>
                </select>
            </div>
            <div class="col-md-6">
                <input type="text" class="form-control" id="buscarIncidencia" placeholder="Buscar por número de espacio">
            </div>
        </div>

        <!-- Tabla de Incidencias -->
        <div class="row">
            <div class="col">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Número de Espacio</th>
                            <th>Tipo de Incidencia</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="incidenciasTabla">
                        <!-- Filas dinámicas generadas por JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Botón para regresar al menú principal -->
        <div class="row mb-3">
            <div class="col">
                <a href="index.html" class="btn btn-light w-100">
                    <i class="bi bi-house-door"></i> Regresar al Menú Principal
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/scripts/config.js"></script>
    <script src="../../assets/scripts/guardia/reportes.js"></script>
</html>
