<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estacionamiento - Menú Principal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Arial', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            min-height: 100vh; /* Asegurar que el body ocupe toda la ventana */
            margin: 0; /* Eliminar márgenes predeterminados */
        }

        .main-container {
            max-width: 900px; /* Limitar el ancho máximo */
            margin: 0 auto; /* Centrar el contenido */
            padding: 20px;
            flex: 1; /* Hacer que el contenedor principal crezca según el espacio disponible */
        }

        #welcomeMessage {
            color: #ffffff;
            font-weight: bold;
            font-size: 2rem;
        }

        .btn-custom {
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .btn-primary-custom {
            background-color: #4CAF50;
            border-color: #4CAF50;
        }

        .btn-primary-custom:hover {
            background-color: #45A149;
        }

        .btn-warning-custom {
            background-color: #FFA726;
            border-color: #FFA726;
        }

        .btn-warning-custom:hover {
            background-color: #FF9800;
        }

        .btn-danger-custom {
            background-color: #D32F2F;
            border-color: #D32F2F;
        }

        .btn-danger-custom:hover {
            background-color: #C62828;
        }

        .card-custom {
            border-radius: 15px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        footer {
            background-color: #212529;
            padding: 15px 0;
        }

        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Sistema de Estacionamiento</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <!-- Ícono de casa -->
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="../../index.html">
                            <i class="bi bi-house-door-fill"></i> Inicio
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor principal centrado -->
    <div class="main-container">
        <!-- Banner Informativo -->
        <div class="alert alert-info alert-dismissible fade show" role="alert">
            <strong>¡Atención!</strong> Recuerda verificar los reportes de incidentes a tiempo.
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <!-- Botones principales -->
        <div class="row flex-grow-1 align-items-center g-3">
            <div class="col-12 col-md-6">
                <div class="card card-custom">
                    <i class="bi bi-car-front-fill card-icon"></i>
                    <a href="gestion_espacio.html" class="btn btn-primary-custom btn-lg w-100 py-4 shadow-sm">
                        Gestionar Espacios
                    </a>
                </div>
            </div>
            <div class="col-12 col-md-6">
                <div class="card card-custom">
                    <i class="bi bi-exclamation-triangle-fill card-icon"></i>
                    <a href="reportes.html" class="btn btn-warning-custom btn-lg w-100 py-4 shadow-sm">
                        Reportes
                    </a>
                </div>
            </div>
        </div>

        <!-- Botón de cerrar sesión -->
        <div class="row mb-5">
            <div class="col">
                <button id="logoutBtn" class="btn btn-danger-custom btn-lg w-100 shadow-sm">
                    <i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Agregar funcionalidad al botón de cerrar sesión
        const logoutBtn = document.getElementById('logoutBtn');
        
        logoutBtn.addEventListener('click', () => {
            // Confirmar acción de cerrar sesión (opcional)
            const confirmar = confirm('¿Estás seguro de que deseas cerrar sesión?');
            if (confirmar) {
                // Redirigir al login.html
                window.location.href = 'login.html';
            }
        });
    </script>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4">
        <div class="container">
            <div class="d-flex justify-content-center mb-3">
                <a href="#" class="text-white mx-2"><i class="bi bi-facebook"></i></a>
                <a href="#" class="text-white mx-2"><i class="bi bi-instagram"></i></a>
                <a href="#" class="text-white mx-2"><i class="bi bi-youtube"></i></a>
                <a href="#" class="text-white mx-2"><i class="bi bi-linkedin"></i></a>
            </div>
            <p>© 2024 TecPark. Todos los derechos reservados. <a href="#" class="text-decoration-none text-white">Política de Privacidad</a></p>
        </div>
    </footer>
</body>
</html>
