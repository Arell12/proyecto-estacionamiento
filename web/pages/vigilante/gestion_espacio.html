<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estacionamiento - Espacios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="row mt-4 mb-3">
            <div class="col">
                <h2>Gestión de Espacios</h2>
            </div>
        </div>
        
        <div class="row mb-3">
            <div class="col-md-4">
                <select class="form-select" id="filtroEstado">
                    <option value="">Todos los estados</option>
                    <option value="disponible">Disponible</option>
                    <option value="ocupado">Ocupado</option>
                </select>
            </div>
            <div class="col-md-4">
                <input type="text" class="form-control" id="filtroBusqueda" placeholder="Buscar por número de espacio">
            </div>
            <div class="col-md-4">
                <button class="btn btn-primary" id="btnBuscar">Buscar</button>
            </div>
        </div>
        
        <div class="row">
            <div class="col">
                <table class="table table-striped" id="tablaEspacios">
                    <thead>
                        <tr>
                            <th>Número de Espacio</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="espaciosTabla">
                        <!-- Filas dinámicas generadas con JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col">
                <a href="index.html" class="btn btn-light w-100">
                    <i class="bi bi-house-door"></i> Regresar al Menú Principal
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/scripts/config.js"></script>
    <script src="../../assets/scripts/guardia/gestion_espacio.js"></script>
</body>
</html>
